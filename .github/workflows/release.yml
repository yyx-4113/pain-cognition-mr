name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package reproduction bundle (exclude raw data and individual-level derived files)
        run: |
          zip -r pain-cognition-mr-${{ github.event.release.tag_name || 'snapshot' }}.zip \
            . -x 'data/raw/*' 'data/derived/charls_long.csv' '*.rds' '*.rds.bak*' \
               '*.git*' '.github/*' 'tools/*' 'UnRAR.exe' 'license.txt' '*.bak*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pain-cognition-mr-bundle
          path: pain-cognition-mr-*.zip
